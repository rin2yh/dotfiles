[tasks.setup]
description = "Run full setup with dependencies"
depends = ["home:link", "brew-bundle", "config:link", "tools"]

[tasks."home:link"]
description = "Deploy home dotfiles"
run = """
echo "Deploying dotfiles from ./home to $HOME..."
find ./home -type f | while read -r src; do
    rel_path="${src#./home/}"
    target="$HOME/$rel_path"
    mkdir -p "$(dirname "$target")"
    ln -snf "$(pwd)/home/$rel_path" "$target"
    echo "Linked: $rel_path"
done
"""

[tasks.brew-bundle]
description = "Install packages via Homebrew"
depends = ["home:link"]
run = "brew bundle --global"

[tasks."config:link"]
description = "Deploy config dotfiles"
depends = ["brew-bundle"]
run = """
mkdir -p "$HOME/.config"
find ./config -maxdepth 1 -mindepth 1 -type d | while read -r src_dir; do
    dir_name=$(basename "$src_dir")
    target="$HOME/.config/$dir_name"
    ln -sfn "$(pwd)/config/$dir_name" "$target"
    echo "Linked: $dir_name"
done
"""

[tasks.tools]
description = "Install development tools (mise, gopls, docker-language-server)"
depends = ["config:link"]
run = """
echo "Installing mise tools..."
mise install

echo "Installing gopls for nvim LSP..."
go install golang.org/x/tools/gopls@latest

echo "Installing docker-language-server for nvim LSP..."
DOCKER_LS_VERSION=$(curl -sL "https://api.github.com/repos/docker/docker-language-server/releases/latest" | grep -o '"tag_name": *"[^"]*"' | head -1 | grep -o 'v[^"]*')
ARCH=$(uname -m | sed 's/x86_64/amd64/' | sed 's/aarch64/arm64/')
OS=$(uname -s | tr '[:upper:]' '[:lower:]')
curl -sL "https://github.com/docker/docker-language-server/releases/download/${DOCKER_LS_VERSION}/docker-language-server-${OS}-${ARCH}-${DOCKER_LS_VERSION}" -o "$(go env GOPATH)/bin/docker-language-server"
chmod +x "$(go env GOPATH)/bin/docker-language-server"
"""
