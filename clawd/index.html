<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Clawd — GLSL animation</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #000;
    overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #d77757;
  }
  #c {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  .label {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    letter-spacing: 0.4em;
    font-size: 12px;
    opacity: 0.55;
    user-select: none;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">CLAWD</div>
<script id="vs" type="x-shader/x-vertex">#version 300 es
in vec2 a_pos;
void main() {
  gl_Position = vec4(a_pos, 0.0, 1.0);
}
</script>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;

uniform vec2  u_resolution;
uniform float u_time;
out vec4 fragColor;

// Palette mirrors Claude Code's clawd_* / chromeYellow theme tokens.
const vec3 BODY     = vec3(215.0, 119.0,  87.0) / 255.0;
const vec3 INSIDE   = vec3(  0.0,   0.0,   0.0) / 255.0;
const vec3 WARN     = vec3(251.0, 188.0,   4.0) / 255.0;
const vec3 BG_TOP   = vec3( 18.0,  10.0,  28.0) / 255.0;
const vec3 BG_BOT   = vec3(  4.0,   2.0,   8.0) / 255.0;

float sdRoundBox(vec2 p, vec2 b, float r) {
  vec2 q = abs(p) - b + r;
  return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
}

float sdCircle(vec2 p, float r) { return length(p) - r; }

float sdSegment(vec2 p, vec2 a, vec2 b) {
  vec2 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h);
}

// Approximation of the ✻ sparkle: mixes Chebyshev and 45°-rotated norms.
float sdSparkle(vec2 p, float r) {
  p = abs(p);
  float a = max(p.x, p.y);
  float b = (p.x + p.y) * 0.7071;
  return mix(a, b, 0.6) - r;
}

float opSmoothUnion(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

mat2 rot2(float a) {
  float c = cos(a), s = sin(a);
  return mat2(c, -s, s, c);
}

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

void main() {
  vec2 res = u_resolution;
  vec2 uv  = (gl_FragCoord.xy - 0.5 * res) / res.y;

  float t = u_time;

  float vy = clamp(uv.y * 0.5 + 0.5, 0.0, 1.0);
  vec3 col = mix(BG_BOT, BG_TOP, vy);

  float vignette = smoothstep(1.1, 0.2, length(uv));
  col += vec3(0.06, 0.03, 0.10) * vignette;

  // Coherent per-cell branch — only the brightest 7% of cells contribute,
  // so gating skips a length() + sin() on the other ~93% of pixels.
  vec2 starUV = uv * 6.0 + vec2(0.0, t * 0.04);
  vec2 cell   = floor(starUV);
  float starH = hash21(cell);
  if (starH > 0.93) {
    vec2 fcell    = fract(starUV) - 0.5;
    float starR   = 0.02 + 0.04 * starH;
    float starD   = length(fcell) - starR;
    float twinkle = 0.5 + 0.5 * sin(t * (1.5 + 3.0 * starH) + starH * 6.28);
    col += vec3(0.9, 0.85, 1.0) * smoothstep(0.05, 0.0, starD) * twinkle * 0.6;
  }

  float bounce = abs(sin(t * 2.6)) * 0.045;
  float tilt   = sin(t * 1.2) * 0.06;
  float breath = 1.0 + 0.025 * sin(t * 2.6 - 0.6);

  // Lift Clawd a bit above the canvas centre so the antenna has room.
  vec2 cuv = uv;
  cuv.y -= bounce - 0.02;
  cuv = rot2(tilt) * cuv;
  cuv /= breath;

  float shadow = smoothstep(0.20, 0.0, length((uv - vec2(0.0, -0.27)) * vec2(1.0, 4.5)));
  col = mix(col, vec3(0.0), shadow * (0.55 - bounce * 4.0));

  float dLower = sdRoundBox(cuv - vec2(0.0, -0.05), vec2(0.225, 0.07), 0.05);
  float dUpper = sdRoundBox(cuv - vec2(0.0,  0.05), vec2(0.18,  0.07), 0.05);
  float dBody  = opSmoothUnion(dLower, dUpper, 0.04);

  float dCap   = sdRoundBox(cuv - vec2(0.0, 0.16), vec2(0.07, 0.035), 0.025);
  dBody        = opSmoothUnion(dBody, dCap, 0.04);

  // Four feet (▘▘ ▝▝) mirrored around x=0 with a gap in the middle.
  vec2 footUV = vec2(abs(cuv.x), cuv.y + 0.135);
  float dFeet = min(
    sdRoundBox(footUV - vec2(0.04, 0.0), vec2(0.018, 0.022), 0.012),
    sdRoundBox(footUV - vec2(0.11, 0.0), vec2(0.018, 0.022), 0.012)
  );
  dBody = opSmoothUnion(dBody, dFeet, 0.012);

  float bodyMask  = smoothstep(0.005, -0.001, dBody);
  vec3  bodyShade = BODY * (0.85 + 0.25 * smoothstep(-0.18, 0.18, cuv.y));
  float hl = smoothstep(0.12, 0.0, length(cuv - vec2(-0.06, 0.10)));
  bodyShade += vec3(0.18, 0.10, 0.06) * hl;
  col = mix(col, bodyShade, bodyMask);

  float rim = smoothstep(0.012, 0.0, abs(dBody));
  col += BODY * rim * 0.35;

  // Hollow inset matching ▛███▜ / █████ in the terminal art.
  float dInner = sdRoundBox(cuv, vec2(0.165, 0.10), 0.04);
  float innerMask = smoothstep(0.003, -0.003, dInner) * bodyMask;
  col = mix(col, INSIDE, innerMask * 0.92);

  // Eyes only contribute inside the hollow inset; gate the whole block on
  // innerMask to skip blink + look + two SDFs on the rest of the screen.
  if (innerMask > 0.0) {
    float blinkPhase = fract(t * 0.28);
    float blink = smoothstep(0.0, 0.04, blinkPhase) *
                  (1.0 - smoothstep(0.94, 1.0, blinkPhase));
    vec2 eyeL = cuv - vec2(-0.055, 0.015);
    vec2 eyeR = cuv - vec2( 0.055, 0.015);
    vec2 look = vec2(sin(t * 0.7) * 0.008, cos(t * 0.9) * 0.004);
    float eyeMask = smoothstep(0.003, 0.0, min(sdCircle(eyeL, 0.018), sdCircle(eyeR, 0.018)));
    col = mix(col, vec3(1.0, 0.96, 0.92), eyeMask * blink * innerMask);

    float pupMask = smoothstep(0.002, 0.0,
      min(sdCircle(eyeL - look, 0.009), sdCircle(eyeR - look, 0.009)));
    col = mix(col, vec3(0.04, 0.02, 0.0), pupMask * blink * innerMask);
  }

  float dLine = sdSegment(cuv, vec2(0.0, 0.205), vec2(0.0, 0.255)) - 0.006;
  col = mix(col, WARN * 0.55, smoothstep(0.004, 0.0, dLine));

  vec2 sp = rot2(t * 0.9) * (cuv - vec2(0.0, 0.295));
  float pulse = 0.025 + 0.005 * sin(t * 4.0);
  float dSp = sdSparkle(sp, pulse);
  col = mix(col, WARN, smoothstep(0.006, 0.0, dSp));
  col += WARN * smoothstep(0.06, 0.0, dSp) * 0.45;

  for (int i = 0; i < 14; i++) {
    float fi = float(i);
    float a  = fi * 0.4488 + t * (0.35 + 0.05 * fi);
    float rr = 0.36 + 0.04 * sin(t * 0.8 + fi * 1.7);
    vec2 pp  = vec2(cos(a), sin(a) * 0.55) * rr;
    float mm = smoothstep(0.005, 0.0, length(uv - pp) - 0.0035);
    vec3 c   = mix(BODY, WARN, 0.5 + 0.5 * sin(fi));
    col += c * mm * (0.5 + 0.5 * sin(t * 2.5 + fi));
  }

  col = col / (1.0 + col * 0.6);
  col = pow(col, vec3(0.95));

  fragColor = vec4(col, 1.0);
}
</script>
<script>
(() => {
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl2', { antialias: true, premultipliedAlpha: false });
  if (!gl) {
    document.body.innerHTML = '<pre style="color:#d77757;padding:24px">WebGL2 is required to view Clawd.</pre>';
    return;
  }

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src.trim());
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      throw new Error('shader compile failed');
    }
    return s;
  }

  const vs = compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent);
  const fs = compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent);
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(prog));
    throw new Error('program link failed');
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
    gl.STATIC_DRAW
  );
  const loc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const uRes  = gl.getUniformLocation(prog, 'u_resolution');
  const uTime = gl.getUniformLocation(prog, 'u_time');

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.floor(window.innerWidth  * dpr);
    const h = Math.floor(window.innerHeight * dpr);
    if (canvas.width === w && canvas.height === h) return;
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
    gl.uniform2f(uRes, w, h);
  }
  window.addEventListener('resize', resize);
  resize();

  const start = performance.now();
  function frame() {
    gl.uniform1f(uTime, (performance.now() - start) / 1000);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
