name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.nix"
      - "flake.lock"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: nixfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Check formatting
        run: nix run nixpkgs#nixfmt-rfc-style -- --check $(git ls-files '*.nix')

  build:
    name: build darwinConfiguration (${{ matrix.profile }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        profile:
          - default
          - work
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Build darwin system
        run: nix build --print-build-logs '.#darwinConfigurations.${{ matrix.profile }}.system'
