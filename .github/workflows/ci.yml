name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.nix"
      - "flake.lock"
      - ".github/workflows/ci.yml"

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: nixfmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout のみ
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Check formatting
        run: nix run nixpkgs#nixfmt -- --check $(git ls-files '*.nix')

  build:
    name: build darwinConfiguration
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read # checkout のみ
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build darwin system
        run: nix build --print-build-logs '.#darwinConfigurations.default.system'
