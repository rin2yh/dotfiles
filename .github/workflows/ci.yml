name: CI

on:
  pull_request:
    branches: [for-business]
    paths:
      - "**/*.nix"
      - "flake.lock"
      - "home/mise/config.toml"
      - ".github/workflows/ci.yml"

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: nixfmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout のみ
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Check formatting
        run: nix run nixpkgs#nixfmt -- --check $(git ls-files '*.nix')

  build:
    name: build darwinConfiguration
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read # checkout のみ
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Build darwin system
        run: nix build --print-build-logs '.#darwinConfigurations.default.system'

      - name: Install changed pinned mise tools
        run: |
          MISE_STORE_PATH="$(nix eval --raw .#darwinConfigurations.default.pkgs.mise.outPath)"
          export MISE_BIN="$MISE_STORE_PATH/bin/mise"
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tomllib

          before = tomllib.loads(subprocess.check_output(
              ["git", "show", "HEAD^1:home/mise/config.toml"], text=True
          ))["tools"]
          with open("home/mise/config.toml", "rb") as config_file:
              after = tomllib.load(config_file)["tools"]

          fixed_semver = re.compile(r"^v?\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$")
          changed = [
              (tool, version)
              for tool, version in after.items()
              if before.get(tool) != version
              and isinstance(version, str)
              and fixed_semver.fullmatch(version)
          ]

          if not changed:
              print("No changed pinned mise tools to install.")
          for tool, version in changed:
              print(f"Installing {tool}@{version}", flush=True)
              subprocess.run([os.environ["MISE_BIN"], "install", f"{tool}@{version}"], check=True)
          PY
