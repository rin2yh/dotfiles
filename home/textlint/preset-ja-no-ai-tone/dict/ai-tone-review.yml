version: 1

# AI っぽい文体のうち「人間が中身を判断しないと直せないもの」を集めた辞書。
#
# ここでの expected は置換候補ではなく **書き直しの方針** を書く。prh の報告は
# 「マッチした文字列 => expected」の形で出るため、方針をそのまま指摘文として読ませられる。
# その代償として、この辞書のルールに --fix を当てると方針の文言が本文に埋め込まれてしまう。
# 自動修正は ai-tone.yml だけに当てること（`npm run fix` はこの辞書を外して実行する）。
#
# 判断基準はどれも同じで、「その語を消したときに読者が失う情報があるか」。
# 失うものが無ければ、その語は文章を長く見せるためだけに存在している。

rules:
  # ------------------------------------------------------------------
  # 1. 予告と要約の定型句
  #    これから書くこと・いま書いたことを説明する文は、本文そのものと重複する。
  #    人間の書き手は目次と見出しでこれを済ませる。
  # ------------------------------------------------------------------
  - expected: 予告の文を削り、本題から書き始める
    scope: chat
    patterns:
      - /本記事では[^。]{0,40}(します|する|ます)/
      - /本章では[^。]{0,40}(扱います|扱う|解説します|解説する)/
      - /この記事では[^。]{0,40}(します|する|ます)/
    specs:
      - from: 本記事では設定手順を解説します。
        to: 予告の文を削り、本題から書き始める。

  - expected: 要約を削るか、要約だけを残して本文を削る
    patterns:
      - まとめると
      - 要するに
      - 総括すると
      - 端的に言えば
    specs:
      - from: まとめると設定は二つだ
        to: 要約を削るか、要約だけを残して本文を削る設定は二つだ

  - expected: 問いかけを削って断定で終える
    scope: chat
    patterns:
      - /いかがでした(でしょうか|か)/
      - /してみては(いかがでしょうか|どうでしょうか)/
      - /みてください(ね)?。/
    specs:
      - from: いかがでしたでしょうか
        to: 問いかけを削って断定で終える

  # ------------------------------------------------------------------
  # 2. 中身のない価値づけ
  #    「重要」「不可欠」は、なぜ重要かを書かない限り読者の判断を助けない。
  #    重要さは形容ではなく、満たせなかったときに何が起きるかで示す。
  # ------------------------------------------------------------------
  - expected: 何がどう困るのかを書く
    patterns:
      - /重要なのは[^。]{1,40}(です|だ|である)/
      - /(が|は)重要です/
      - /(が|は)重要である/
    specs:
      - from: 重要なのは冪等性である
        to: 何がどう困るのかを書く

  - expected: 無いと何が成立しないのかを書く
    scope: chat
    patterns:
      - 不可欠
      - 欠かせない
      - 必要不可欠
    specs:
      - from: 監視は不可欠だ
        to: 監視は無いと何が成立しないのかを書くだ

  - expected: 具体的にどの部分かを書く
    scope: chat
    patterns:
      - 核心的
      - 核心は
      - 鍵となる
      - 鍵を握る
      - 肝となる
    specs:
      - from: 鍵となる設定はこれだ
        to: 具体的にどの部分かを書く設定はこれだ

  # ------------------------------------------------------------------
  # 3. 範囲をぼかす限定
  #    「様々な」「多角的に」は範囲を述べたように見えて何も限定していない。
  #    数を書くか、列挙するか、削るかの三択になる。
  # ------------------------------------------------------------------
  - expected: 数を書くか列挙する
    scope: chat
    patterns:
      - 様々な
      - さまざまな
      - 多種多様な
      - 幅広い
      - 数多くの
    specs:
      - from: 様々な要因がある
        to: 数を書くか列挙する要因がある

  - expected: どの観点かを名指しする
    scope: chat
    patterns:
      - 多角的に
      - 包括的に
      - 総合的に
      - 網羅的に
    specs:
      - from: 多角的に検討する
        to: どの観点かを名指しする検討する

  - expected: 扱うなら書く、扱わないなら言及ごと削る
    patterns:
      - /について(も)?(触れます|触れる|触れておく)/
      - /に(も)?言及(します|する)/
    specs:
      - from: 制約についても触れます
        to: 制約扱うなら書く、扱わないなら言及ごと削る

  # ------------------------------------------------------------------
  # 4. 空虚な動詞
  #    「掘り下げる」「紐解く」は、実際に何をするのかを言い換えただけで
  #    動作を指していない。分析するのか、測るのか、読むのかを書く。
  # ------------------------------------------------------------------
  - expected: 実際にする操作の名前を書く
    scope: chat
    patterns:
      - 掘り下げ
      - 紐解く
      - ひも解く
      - 深掘り
      - 落とし込む
      - 腹落ち
    specs:
      - from: 仕様を掘り下げる
        to: 仕様を実際にする操作の名前を書くる

  - expected: 主語と動作を具体化する
    patterns:
      - /(を|の)言語化(する|します)/
      - /(を|の)可視化(する|します)/
    specs:
      - from: 課題を言語化する
        to: 課題主語と動作を具体化する

  # ------------------------------------------------------------------
  # 5. 逃げのヘッジ
  #    根拠があるなら断定でき、無いなら書く必要がない。
  #    「だろう」で終わる文は、書き手が検証を省いた印になりやすい。
  # ------------------------------------------------------------------
  - expected: 断定するか、根拠を添えて条件を書く
    patterns:
      - /と(言え|いえ)る(だろう|でしょう)/
      - /ではない(だろうか|でしょうか)/
      - /かも(しれません|しれない)/
      - /と考えられ(ます|る)/
    specs:
      - from: 有効と言えるだろう
        to: 有効断定するか、根拠を添えて条件を書く

  # ------------------------------------------------------------------
  # 6. 締めの常套句
  #    記事の最後に置かれる「第一歩」「活用することで」は、
  #    読者が次に何をすればよいかを何も指定していない。
  # ------------------------------------------------------------------
  - expected: 読者が次に取る操作を一つ書く
    scope: chat
    patterns:
      - /(の)?第一歩(となる|になる|です)/
      - /活用すること(で|により)/
      - /役立てて(ください|いただければ)/
    specs:
      - from: 理解の第一歩となる
        to: 理解読者が次に取る操作を一つ書く

  # ------------------------------------------------------------------
  # 7. 演出過多
  #    絵文字は論理の切れ目ではなく雰囲気で強調を配るので、
  #    技術文書では見出しにも本文にも情報を足さない。
  #    prh は Markdown の記法を取り除いた本文を見るため、見出し記号では判定できない。
  #    また prh の正規表現リテラルは gimy フラグしか受け付けず、Unicode 範囲指定
  #    （\u{...} やサロゲートペア）が書けない。そこで実際に LLM が多用する字を列挙する。
  #    新しい絵文字が目についたらこの patterns に足すのが正しい更新方法。
  # ------------------------------------------------------------------
  - expected: 絵文字を外す
    scope: chat
    patterns:
      - 🚀
      - ✨
      - 🎯
      - 💡
      - 🔥
      - 📝
      - ⚡
      - ✅
      - 🎉
      - 🔧
      - 📌
      - 👍
      - 💪
      - 🧠
      - 🔍
      - 📊
      - ⚠
      - 🌟
      - 🙌
      - 📚
    specs:
      - from: 🚀 セットアップ
        to: 絵文字を外す セットアップ
