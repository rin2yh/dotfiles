version: 1

# AI っぽい文体を検出する辞書。preset-ja-technical-writing が文の長さ・表記ゆれ・文法という
# 形式を見るのに対して、こちらは情報を運んでいない語を見る。.textlintrc.json で両方を併用する。
#
#   cd home/textlint && textlint --config .textlintrc.json <file>
#
# textlint と 2 つのルールの版は home/mise/config.toml で固定している。
#
# 各ルールには specs を必ず書く。prh は specs が通らないとロード自体を失敗させるため、
# specs がそのままルールの回帰テストになる。辞書を更新するときはここを増やすこと。

rules:
  # 程度副詞の水増し
  # LLM は形容詞の前に程度副詞を置いて「力の入った文」に見せがちだが、
  # 根拠のない強調は情報量ゼロで、削っても命題は変わらない。
  - expected: ""
    patterns:
      - 非常に
      - きわめて
      - 極めて
    specs:
      - from: 非常に重い処理になる
        to: 重い処理になる
      - from: 極めて有効な手段だ
        to: 有効な手段だ

  # 「しっかり」は動詞を修飾するときだけ水増しで、「しっかりした」「しっかりする」のように
  # サ変述語を作る形では述語の中身そのもの。裸で拾って削ると「しっかりした作り」が「した作り」に、
  # 「土台をしっかりする」が「土台をする」になり本文が壊れる。
  # 除外はサ変の活用語幹をすべて並べる（し・す・せ・さ）。1 つでも漏らすとそこから壊れる。
  # 「しっかり感」のように名詞をつくる形も同じで、削ると「感のある作り」になる。
  # 後続の 1 文字を捕まえて書き戻しているが、いまは (?![しすせさと感]) とも書ける。
  # prh は複数 pattern を 1 本の選択に畳むためグループ番号がずれる。$1 を使う規則は 1 パターンずつ書く。
  - expected: $1
    pattern: /しっかりと([^しすせさ感])/
    specs:
      - from: しっかりと検証する
        to: 検証する
      - from: しっかりとした基盤
        to: しっかりとした基盤
      - from: 土台をしっかりとする
        to: 土台をしっかりとする
      - from: しっかりと感じられる
        to: しっかりと感じられる

  - expected: $1
    pattern: /しっかり([^しすせさと感])/
    specs:
      - from: しっかり検証する
        to: 検証する
      - from: 基盤はしっかりした作りだ
        to: 基盤はしっかりした作りだ
      - from: 土台がしっかりしている
        to: 土台がしっかりしている
      - from: 土台をしっかりする
        to: 土台をしっかりする
      - from: 検証をしっかりせずに公開した
        to: 検証をしっかりせずに公開した
      - from: しっかり感のある作りだ
        to: しっかり感のある作りだ

  - expected: ""
    pattern: まさに
    specs:
      - from: まさに理想的な構成だ
        to: 理想的な構成だ

  - expected: ""
    patterns:
      - ぜひとも
      - ぜひ
    specs:
      - from: ぜひ試してほしい
        to: 試してほしい

  # 冗長な述語
  # 「〜を行う」「〜することが可能です」は動詞一語で言える。
  # 文字数だけ増えて主張が増えないので、AI 文の密度の低さに直結する。
  - expected: $1できます
    pattern: /([ぁ-んァ-ヶ一-龠ー]+)することが可能です/
    specs:
      - from: 並列に実行することが可能です
        to: 並列に実行できます

  - expected: $1できる
    pattern: /([ぁ-んァ-ヶ一-龠ー]+)することが可能だ/
    specs:
      - from: 並列に実行することが可能だ
        to: 並列に実行できる

  # 「〜を行う」は動詞一語で言えるが、置換して成立するのはサ変名詞に限る。
  # 「儀式を行う」を「儀式する」にはできない。任意の漢字 2 文字以上で拾うと誤った書き直しを促すため、
  # サ変名詞を明示的に列挙している。取りこぼしを見つけたらこの列挙に足すのが正しい更新方法。
  - expected: $1する
    pattern: /(設定|実行|確認|検証|処理|初期化|変換|移行|更新|削除|追加|登録|取得|保存|比較|測定|評価|検討|調査|分析|定義|生成|構築|導入|管理|監視|通知|同期|認証|集計|判定|計測|検索|入力|出力|表示)を行う/
    specs:
      - from: 設定を行う手順
        to: 設定する手順
      - from: 儀式を行う
        to: 儀式を行う

  - expected: $1します
    pattern: /(設定|実行|確認|検証|処理|初期化|変換|移行|更新|削除|追加|登録|取得|保存|比較|測定|評価|検討|調査|分析|定義|生成|構築|導入|管理|監視|通知|同期|認証|集計|判定|計測|検索|入力|出力|表示)を行います/
    specs:
      - from: 初期化を行います
        to: 初期化します
      - from: 儀式を行います
        to: 儀式を行います

  # 中身のない接続の水増し
  # 「〜において」「〜という観点から」は助詞 1 つで置き換えられる。
  # 連発すると論理関係を書いたつもりで何も限定していない文になる。
  - expected: $1で
    pattern: /([一-龠ー]{2,})においては/
    specs:
      - from: 本番環境においては注意する
        to: 本番環境で注意する

  - expected: $1で
    pattern: /([一-龠ー]{2,})において/
    specs:
      - from: 開発環境において再現する
        to: 開発環境で再現する

  # 記号
  # em dash は日本語の本文では読点や括弧で表せる。
  # LLM の英語的な癖がそのまま出る箇所なので、見つけたら直す。
  - expected: 、
    patterns:
      - /\s*—\s*/
      - /\s*――\s*/
    specs:
      - from: 設定は単純だ — つまり書き換えるだけだ
        to: 設定は単純だ、つまり書き換えるだけだ

  # ここから下は、人間が中身を判断しないと直せない規則。
  # expected は置換候補ではなく **書き直しの方針** を書く。prh の報告は
  # 「マッチした文字列 => expected」の形で出るため、方針をそのまま指摘文として読ませられる。
  # その代償として、この辞書に textlint --fix を当てると方針の文言が本文に埋め込まれる。
  # 自動修正は提供していない。手で --fix を叩かないこと。
  #
  # 判断基準はどれも同じで、「その語を消したときに読者が失う情報があるか」。
  # 失うものが無ければ、その語は文章を長く見せるためだけに存在している。

  # 予告と要約の定型句
  # これから書くこと・いま書いたことを説明する文は、本文そのものと重複する。
  # 人間の書き手は目次と見出しでこれを済ませる。
  - expected: 予告の文を削り、本題から書き始める
    patterns:
      - /本記事では[^。]{0,40}(します|する|ます)/
      - /本章では[^。]{0,40}(扱います|扱う|解説します|解説する)/
      - /この記事では[^。]{0,40}(します|する|ます)/
    specs:
      - from: 本記事では設定手順を解説します。
        to: 予告の文を削り、本題から書き始める。

  # 「まとめると」は要約の接続詞と、「一つにまとめると」のような条件の「〜と」が同形。
  # 後者は普通の日本語なので拾ってはいけない。直前の助詞を捕まえて
  # regexpMustEmpty で「空のときだけ一致」とする。(?<![にへとでを]) でも同じ。
  - expected: 要約を削るか、要約だけを残して本文を削る
    pattern: /(に|へ|と|で|を)?まとめると/
    regexpMustEmpty: $1
    specs:
      - from: まとめると設定は二つだ
        to: 要約を削るか、要約だけを残して本文を削る設定は二つだ
      - from: 一つの辞書にまとめると壊れる
        to: 一つの辞書にまとめると壊れる
      - from: 章ごとにまとめると読みやすい
        to: 章ごとにまとめると読みやすい

  - expected: 要約を削るか、要約だけを残して本文を削る
    patterns:
      - 要するに
      - 総括すると
      - 端的に言えば
    specs:
      - from: 要するに設定は二つだ
        to: 要約を削るか、要約だけを残して本文を削る設定は二つだ

  - expected: 問いかけを削って断定で終える
    patterns:
      - /いかがでした(でしょうか|か)/
      - /してみては(いかがでしょうか|どうでしょうか)/
      - /みてください(ね)?。/
    specs:
      - from: いかがでしたでしょうか
        to: 問いかけを削って断定で終える

  # 中身のない価値づけ
  # 「重要」「不可欠」は、なぜ重要かを書かない限り読者の判断を助けない。
  # 重要さは形容ではなく、満たせなかったときに何が起きるかで示す。
  - expected: 何がどう困るのかを書く
    patterns:
      - /重要なのは[^。]{1,40}(です|だ|である)/
      - /(が|は)重要です/
      - /(が|は)重要である/
    specs:
      - from: 重要なのは冪等性である
        to: 何がどう困るのかを書く

  - expected: 無いと何が成立しないのかを書く
    patterns:
      - 不可欠
      - 欠かせない
      - 必要不可欠
    specs:
      - from: 監視は不可欠だ
        to: 監視は無いと何が成立しないのかを書くだ

  - expected: 具体的にどの部分かを書く
    patterns:
      - 核心的
      - 核心は
      - 鍵となる
      - 鍵を握る
      - 肝となる
    specs:
      - from: 鍵となる設定はこれだ
        to: 具体的にどの部分かを書く設定はこれだ

  # 範囲をぼかす限定
  # 「様々な」「多角的に」は範囲を述べたように見えて何も限定していない。
  # 数を書くか、列挙するか、削るかの三択になる。
  # 「幅広い」はここに入れていた時期があるが、削除テストに落ちるので外した。
  # 「幅広い層に使われている」から語を消すと「層に使われている」になり、命題が変わる。
  # 広さそのものが主張の中身なので、この規則の基準（消しても意味が変わらない語）を満たさない。
  # 下の from と to を同じにした spec が、戻したときにテストを落とす見張りになる。
  - expected: 数を書くか列挙する
    patterns:
      - 様々な
      - さまざまな
      - 多種多様な
      - 数多くの
    specs:
      - from: 様々な要因がある
        to: 数を書くか列挙する要因がある
      - from: 幅広い層に使われている
        to: 幅広い層に使われている
      - from: 対応ブラウザは幅広い
        to: 対応ブラウザは幅広い

  - expected: どの観点かを名指しする
    patterns:
      - 多角的に
      - 包括的に
      - 総合的に
      - 網羅的に
    specs:
      - from: 多角的に検討する
        to: どの観点かを名指しする検討する

  - expected: 扱うなら書く、扱わないなら言及ごと削る
    patterns:
      - /について(も)?(触れます|触れる|触れておく)/
      - /に(も)?言及(します|する)/
    specs:
      - from: 制約についても触れます
        to: 制約扱うなら書く、扱わないなら言及ごと削る

  # 空虚な動詞
  # 「掘り下げる」「紐解く」は、実際に何をするのかを言い換えただけで
  # 動作を指していない。分析するのか、測るのか、読むのかを書く。
  - expected: 実際にする操作の名前を書く
    patterns:
      - 掘り下げ
      - 紐解く
      - ひも解く
      - 深掘り
      - 落とし込む
      - 腹落ち
    specs:
      - from: 仕様を掘り下げる
        to: 仕様を実際にする操作の名前を書くる

  - expected: 主語と動作を具体化する
    patterns:
      - /(を|の)言語化(する|します)/
      - /(を|の)可視化(する|します)/
    specs:
      - from: 課題を言語化する
        to: 課題主語と動作を具体化する

  # 「効く」は何がどう働くのかを名指ししない。「2 つの経路で効く」と書いても
  # 何が起きるのかが決まらないので、読み手は動作を想像で補うことになる。
  # ただし薬・ブレーキ・キャッシュのように、語の側で動作が決まっている用法もある。
  # それらは regexpMustEmpty で外し、抽象的な主語に付いた場合だけを拾う。
  - expected: 何がどう働くのかを書く
    pattern: /(薬|ブレーキ|冷房|暖房|キャッシュ|補完|割引|型|麻酔|効き目)?(が|は|も)?効(く|いて|かな|きます)/
    regexpMustEmpty: $1
    specs:
      - from: 2 つの経路で効く
        to: 2 つの経路で何がどう働くのかを書く
      - from: この規則の中でしか効かない
        to: この規則の中でしか何がどう働くのかを書くい
      - from: 薬が効く
        to: 薬が効く
      - from: キャッシュが効いている
        to: キャッシュが効いている

  # 逃げのヘッジ
  # 根拠があるなら断定でき、無いなら書く必要がない。
  # 「だろう」で終わる文は、書き手が検証を省いた印になりやすい。
  - expected: 断定するか、根拠を添えて条件を書く
    patterns:
      - /と(言え|いえ)る(だろう|でしょう)/
      - /ではない(だろうか|でしょうか)/
      - /かも(しれません|しれない)/
      - /と考えられ(ます|る)/
    specs:
      - from: 有効と言えるだろう
        to: 有効断定するか、根拠を添えて条件を書く

  # 締めの常套句
  # 記事の最後に置かれる「第一歩」「活用することで」は、
  # 読者が次に何をすればよいかを何も指定していない。
  - expected: 読者が次に取る操作を一つ書く
    patterns:
      - /(の)?第一歩(となる|になる|です)/
      - /活用すること(で|により)/
      - /役立てて(ください|いただければ)/
    specs:
      - from: 理解の第一歩となる
        to: 理解読者が次に取る操作を一つ書く

  # 演出過多
  # 絵文字は論理の切れ目ではなく雰囲気で強調を配るので、
  # 技術文書では見出しと本文のどちらでも情報を足さない。
  # prh が見るのは Markdown の記法を落とした本文で、見出し記号からは判定できない。
  # さらに prh の正規表現リテラルは gimy フラグしか受け付けず、
  # Unicode 範囲指定（\u{...} やサロゲートペア）を書けない。実際に LLM が多用する字を列挙する。
  # 見落としている絵文字を見つけたら、この patterns に足す。
  - expected: 絵文字を外す
    patterns:
      - 🚀
      - ✨
      - 🎯
      - 💡
      - 🔥
      - 📝
      - ⚡
      - ✅
      - 🎉
      - 🔧
      - 📌
      - 👍
      - 💪
      - 🧠
      - 🔍
      - 📊
      - ⚠
      - 🌟
      - 🙌
      - 📚
    specs:
      - from: 🚀 セットアップ
        to: 絵文字を外す セットアップ
