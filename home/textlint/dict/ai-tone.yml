version: 1

# AI っぽい文体のうち「機械的に置換して意味が変わらないもの」だけを集めた辞書。
#
# ここに入れてよいのは、textlint --fix を無条件に適用しても壊れない規則に限る。
# 置換候補が文脈依存になるもの（定型句・空虚な動詞・ヘッジなど）は
# ai-tone-review.yml に置く。両者を混ぜると --fix が使えなくなり、
# 「機械で直せるものまで手作業になる」という一番もったいない状態になる。
#
# 各ルールには specs を必ず書く。prh は specs が通らないとロード自体を失敗させるため、
# specs がそのままルールの回帰テストになる。辞書を更新するときはここを増やすこと。
#
# `scope: chat` は prh が無視する独自キーで、Claude の会話出力を検査するフックの
# 対象に含めるかどうかを示す。会話は文章より短く砕けているので、文書向けの規則を
# そのまま当てると誤検出が増える。「チャットで出たら明らかに直すべき」ものだけに付ける。

rules:
  # ------------------------------------------------------------------
  # 1. 程度副詞の水増し
  #    LLM は形容詞の前に程度副詞を置いて「力の入った文」に見せがちだが、
  #    根拠のない強調は情報量ゼロで、削っても命題は変わらない。
  # ------------------------------------------------------------------
  - expected: ""
    scope: chat
    patterns:
      - 非常に
      - きわめて
      - 極めて
    specs:
      - from: 非常に重い処理になる
        to: 重い処理になる
      - from: 極めて有効な手段だ
        to: 有効な手段だ

  # 「しっかり」は動詞を修飾するときだけ水増しで、「しっかりした」「しっかりする」のように
  # サ変述語を作る形では述語の中身そのもの。裸で拾って削ると「しっかりした作り」が「した作り」に、
  # 「土台をしっかりする」が「土台をする」になり本文が壊れる。
  # 除外はサ変の活用語幹をすべて並べる（し・す・せ・さ）。1 つでも漏らすとそこから壊れる。
  # 「しっかり感」のように名詞をつくる形も同じで、削ると「感のある作り」になる。
  # 後続の 1 文字を捕まえて書き戻す形にしているのは、ripgrep に先読みが無いため。
  # prh は複数 pattern を 1 本の選択に畳むためグループ番号がずれる。$1 を使う規則は 1 パターンずつ書く。
  - expected: $1
    scope: chat
    pattern: /しっかりと([^しすせさ感])/
    specs:
      - from: しっかりと検証する
        to: 検証する
      - from: しっかりとした基盤
        to: しっかりとした基盤
      - from: 土台をしっかりとする
        to: 土台をしっかりとする
      - from: しっかりと感じられる
        to: しっかりと感じられる

  - expected: $1
    scope: chat
    pattern: /しっかり([^しすせさと感])/
    specs:
      - from: しっかり検証する
        to: 検証する
      - from: 基盤はしっかりした作りだ
        to: 基盤はしっかりした作りだ
      - from: 土台がしっかりしている
        to: 土台がしっかりしている
      - from: 土台をしっかりする
        to: 土台をしっかりする
      - from: 検証をしっかりせずに公開した
        to: 検証をしっかりせずに公開した
      - from: しっかり感のある作りだ
        to: しっかり感のある作りだ

  - expected: ""
    scope: chat
    pattern: まさに
    specs:
      - from: まさに理想的な構成だ
        to: 理想的な構成だ

  - expected: ""
    patterns:
      - ぜひとも
      - ぜひ
    specs:
      - from: ぜひ試してほしい
        to: 試してほしい

  # ------------------------------------------------------------------
  # 2. 冗長な述語
  #    「〜を行う」「〜することが可能です」は動詞一語で言える。
  #    文字数だけ増えて主張が増えないので、AI 文の密度の低さに直結する。
  # ------------------------------------------------------------------
  - expected: $1できます
    pattern: /([ぁ-んァ-ヶ一-龠ー]+)することが可能です/
    specs:
      - from: 並列に実行することが可能です
        to: 並列に実行できます

  - expected: $1できる
    pattern: /([ぁ-んァ-ヶ一-龠ー]+)することが可能だ/
    specs:
      - from: 並列に実行することが可能だ
        to: 並列に実行できる

  # 「〜を行う」は動詞一語で言えるが、置換して成立するのはサ変名詞に限る。
  # 「儀式を行う」を「儀式する」にはできない。任意の漢字 2 文字以上で拾うと --fix が本文を壊すため、
  # サ変名詞を明示的に列挙している。取りこぼしを見つけたらこの列挙に足すのが正しい更新方法。
  - expected: $1する
    pattern: /(設定|実行|確認|検証|処理|初期化|変換|移行|更新|削除|追加|登録|取得|保存|比較|測定|評価|検討|調査|分析|定義|生成|構築|導入|管理|監視|通知|同期|認証|集計|判定|計測|検索|入力|出力|表示)を行う/
    specs:
      - from: 設定を行う手順
        to: 設定する手順
      - from: 儀式を行う
        to: 儀式を行う

  - expected: $1します
    pattern: /(設定|実行|確認|検証|処理|初期化|変換|移行|更新|削除|追加|登録|取得|保存|比較|測定|評価|検討|調査|分析|定義|生成|構築|導入|管理|監視|通知|同期|認証|集計|判定|計測|検索|入力|出力|表示)を行います/
    specs:
      - from: 初期化を行います
        to: 初期化します
      - from: 儀式を行います
        to: 儀式を行います

  # ------------------------------------------------------------------
  # 3. 中身のない接続の水増し
  #    「〜において」「〜という観点から」は助詞 1 つで置き換えられる。
  #    連発すると論理関係を書いたつもりで何も限定していない文になる。
  # ------------------------------------------------------------------
  - expected: $1で
    pattern: /([一-龠ー]{2,})においては/
    specs:
      - from: 本番環境においては注意する
        to: 本番環境で注意する

  - expected: $1で
    pattern: /([一-龠ー]{2,})において/
    specs:
      - from: 開発環境において再現する
        to: 開発環境で再現する

  # ------------------------------------------------------------------
  # 4. 記号
  #    em dash は日本語の本文では読点や括弧で表せる。
  #    LLM の英語的な癖がそのまま出る箇所なので、見つけたら直す。
  # ------------------------------------------------------------------
  - expected: 、
    patterns:
      - /\s*—\s*/
      - /\s*――\s*/
    specs:
      - from: 設定は単純だ — つまり書き換えるだけだ
        to: 設定は単純だ、つまり書き換えるだけだ
