[tools]
"aqua:anthropics/claude-code" = "latest"
"aqua:marp-team/marp-cli" = "4.5.1"
# Use mo's GitHub release because its module archive omits embedded assets.
# Its HTTP traffic is loopback-only.
"github:k1LoW/mo" = "v1.7.0"
"github:cli/cli" = "2.103.2"
"github:sago35/tinygo-autocmpl" = "0.8.0"
"github:sivchari/golance" = "0.7.23"
node = "latest"
"npm:ccusage" = "latest"
"npm:textlint" = "15.8.0"
"npm:textlint-rule-prh" = "6.1.1"
"npm:textlint-rule-preset-ja-technical-writing" = "12.0.2"
"npm:@openai/codex" = "latest"

[settings]
minimum_release_age = "7d"
idiomatic_version_file_enable_tools = ["node"]

[env]
DISABLE_AUTOUPDATER = "1"

[tool_alias]
terraform = "tf"
