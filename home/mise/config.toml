[tools]
"aqua:anthropics/claude-code" = "latest"
"aqua:marp-team/marp-cli" = "4.5.1"
# Build Go CLIs from source with the fixed Go toolchain. mo's release embeds
# assets omitted from the module archive; its HTTP traffic is loopback-only.
"github:k1LoW/mo" = "v1.6.9"
"go:github.com/cli/cli/v2/cmd/gh" = { version = "v2.102.0", install_env = { GOTOOLCHAIN = "go1.27.3" } }
"go:github.com/sago35/tinygo-autocmpl" = { version = "v0.8.0", install_env = { GOTOOLCHAIN = "go1.27.3" } }
"go:github.com/sivchari/golance/cmd/golance" = { version = "v0.7.23", install_env = { GOTOOLCHAIN = "go1.27.3" } }
"go:mvdan.cc/gofumpt" = { version = "v0.11.0", install_env = { GOTOOLCHAIN = "go1.27.3" } }
node = "latest"
"npm:ccusage" = "latest"
"npm:textlint" = "15.8.0"
"npm:textlint-rule-prh" = "6.1.0"
"npm:textlint-rule-preset-ja-technical-writing" = "12.0.2"
"npm:@openai/codex" = "latest"

[settings]
minimum_release_age = "7d"
idiomatic_version_file_enable_tools = ["node"]

[env]
DISABLE_AUTOUPDATER = "1"

[tool_alias]
terraform = "tf"
