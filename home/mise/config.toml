[tools]
"aqua:anthropics/claude-code" = "latest"
"aqua:cli/cli" = "2.102.0"
"aqua:marp-team/marp-cli" = "4.5.1"
"github:k1LoW/mo" = "v1.6.9"
"github:sago35/tinygo-autocmpl" = "v0.8.0"
"github:sivchari/gopls-lazy" = "v0.4.1"
node = "latest"
"npm:ccusage" = "latest"
"npm:textlint" = "15.8.0"
"npm:textlint-rule-prh" = "6.1.0"
"npm:textlint-rule-preset-ja-technical-writing" = "12.0.2"
"npm:@openai/codex" = "latest"

[settings]
minimum_release_age = "7d"
idiomatic_version_file_enable_tools = ["node"]

[env]
DISABLE_AUTOUPDATER = "1"

[tool_alias]
terraform = "tf"
