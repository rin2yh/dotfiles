add_newline = true

# ----------------------------------------------------
# format
# ----------------------------------------------------
format = """
$directory\
$git_branch\
$git_status\
$direnv\
$python\
$aws\
$fill\
$cmd_duration\
$time\
\n$character\
"""

# Enable if it appears on the same line as the command
# right_format = """
# $cmd_duration\
# $time\
# """

# ----------------------------------------------------
# left module
# ----------------------------------------------------
[fill]
symbol = '─'

[directory]
truncation_length = 6
truncation_symbol = ' '
truncate_to_repo = false
home_symbol = '~'
read_only = ' 󰌾 '
format = """
[](fg:#7dcfff)\
[$path]($style)\
[$read_only]($read_only_style)\
[](fg:#7dcfff)\
"""
style = 'bold fg:#24283b bg:#7dcfff'
read_only_style = 'bold fg:#24283b bg:#7dcfff'

[git_branch]
symbol = ""
style = "fg:#7aa2f7 bg:#1f2335"
format = """
[](fg:#1f2335)\
[$symbol $branch]($style)\
"""

[git_status]
style = "fg:#7aa2f7 bg:#1f2335"
format = """
[$all_status$ahead_behind]($style)\
[](fg:#1f2335)\
"""

# ----------------------------------------------------
# right module
# ----------------------------------------------------
[cmd_duration]
min_time = 1
style = 'fg:#e0af68'
format = "[ $duration]($style)" # nf-pl-right_soft_divider, nf-mdi-clock

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
format = '[[  $time](fg:#a9b1d6)]($style)'

