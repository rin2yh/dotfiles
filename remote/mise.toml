# remote-nvim のリモート側に home/nvim が呼ぶ LSP サーバ/CLI を揃える。導入は bootstrap.sh。
# [要確認] は未照合。入らなければ `mise registry | grep <tool>` で差し替え。

[tools]
node = "latest"
go   = "latest"

"go:golang.org/x/tools/gopls"      = "latest"
"npm:typescript-language-server"   = "latest"
"npm:typescript"                   = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:@olrtg/emmet-language-server" = "latest"   # [要確認]
"aqua:LuaLS/lua-language-server"   = "latest"   # [要確認]
"aqua:hashicorp/terraform-ls"      = "latest"
"aqua:rust-lang/rust-analyzer"     = "latest"   # [要確認]

"aqua:BurntSushi/ripgrep"       = "latest"
"aqua:jesseduffield/lazygit"    = "latest"
"aqua:jesseduffield/lazydocker" = "latest"
"aqua:tree-sitter/tree-sitter"  = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]
